# Qt comes from the KDE runtime, so only tacky and the app itself are built
# here.
#
# runtime-version is a branch, not a version: org.kde.Sdk//6.11 gets updates, and
# a manifest has nowhere to name the commit it was built against. So the commit
# is recorded outside the manifest, in flatpak/runtime.pin, and
# flatpak/check-runtime-pin.sh holds the installed sdk to it - the same
# arrangement as check-pin.sh and the tacky commit, and for the same reason: the
# one input this build does not compile itself should not be able to move without
# leaving a trace. flatpak/build.sh checks the pin before it builds.

app-id: io.github.pounceandmiss.Quack
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: quackchat

finish-args:
  - --share=network            # XMPP
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc                # X11 MIT-SHM
  - --device=dri               # the scene graph renders on the GPU
  - --socket=pulseaudio        # voice calls (rtc-ma: playback + mic capture)
  # The alerts go straight to the daemon rather than through the notification
  # portal, which is a different interface. Without this they are dropped and
  # the app runs on, silently.
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download  # received and sent attachments
  # The KDE runtime's own default platform theme is Plasma-flavoured, which
  # would outrank main.cpp's fallback on a GNOME host. Force the portal-backed
  # theme instead, so a GNOME host's own accent colour and light/dark follow
  # through the sandbox rather than a KDE palette.
  - --env=QT_QPA_PLATFORMTHEME=xdgdesktopportal

# The archive and header are build-time only; the app links them statically.
cleanup:
  - /lib/tacky

modules:
  - name: tacky
    buildsystem: simple
    build-options:
      # The deliverable is a static archive, which the debuginfo pass has
      # nothing to say about.
      no-debuginfo: true
    build-commands:
      # ZIPPY_OFFLINE=1 turns a staging mistake into a named error rather than a
      # git/curl failure later in the log.
      - make lib ZIPPY_OFFLINE=1
      # The pair CMake's find_path/find_library want under one root.
      - install -Dm644 dist/libtacky.a /app/lib/tacky/dist/libtacky.a
      - install -Dm644 embed/tacky.h /app/lib/tacky/embed/tacky.h
      # Beside the archive, where the quack module's CMake looks for it and
      # stages it next to the binary.
      - install -Dm755 libtacky_webrtc.so /app/lib/tacky/dist/libtacky_webrtc.so
    sources:
      # Pinned rather than tracking main, so the release is built from the
      # archive it was tested against. flatpak-builder cannot read the
      # submodule, so this is the one place the commit is repeated: ctest
      # checks it against third_party/tacky, and check-pin.sh --sync writes
      # the submodule's HEAD here after the pin moves.
      - type: git
        url: https://github.com/pounceandmiss/tacky.git
        commit: f6bab166100f2de150b9ecfb4eb84a5afbc18bb2

      # The webrtc media backend, built outside this manifest: it wants
      # Chromium's clang and a prebuilt libwebrtc, neither of which belongs in
      # an offline flatpak build. flatpak/build.sh refuses to start without it.
      - type: file
        path: ../third_party/tacky/dist/libtacky_webrtc.so

      # zippy's pins, generated and replaced wholesale rather than edited.
      # After a bump, in a tacky checkout:
      #
      #   make -f zippy/zippy.mk flatpak-sources FLATPAK_DEPS_DIR=build/deps
      #
      # FLATPAK_DEPS_DIR is the shared cache tacky's Makefile hands every target
      # as DEPSDIR, and each git dest is the pristine path zippy copies from,
      # patches and all, so nothing here needs patching. The whole table lands,
      # Tk and its packages included: `make lib` builds the tclsh-side set and
      # ignores the rest, and hand-trimming it is what goes stale.
      - type: file
        url: http://prdownloads.sourceforge.net/tcl/tcl9.0.3-src.tar.gz
        sha256: 2537ba0c86112c8c953f7c09d33f134dd45c0fb3a71f2d7f7691fd301d2c33a6
        dest: build/deps
        dest-filename: tcl9.0.3-src.tar.gz
      - type: file
        url: http://prdownloads.sourceforge.net/tcl/tk9.0.3-src.tar.gz
        sha256: bf344efadb618babb7933f69275620f72454d1c8220130da93e3f7feb0efbf9b
        dest: build/deps
        dest-filename: tk9.0.3-src.tar.gz
      - type: file
        url: https://tdom.org/downloads/latest-src.tar.gz
        sha256: 6d24734aef46d1dc16f3476685414794d6a4e65f48079e1029374477104e8319
        dest: build/deps
        dest-filename: tdom-0.9.6-src.tar.gz
      - type: file
        url: https://core.tcl-lang.org/tcllib/uv/tcllib-2.0.tar.gz
        sha256: 590263de0832ac801255501d003441a85fb180b8ba96265d50c4a9f92fde2534
        dest: build/deps
        dest-filename: tcllib-2.0.tar.gz
      - type: file
        url: https://sourceforge.net/projects/tkimg/files/tkimg/2.1/tkimg%202.1.1/Img-2.1.1.tar.gz/download
        sha256: 0e41efa886c470ca0c38663e66640eb6d89e9e5f746724535ac224e2509ae34f
        dest: build/deps
        dest-filename: Img-2.1.1.tar.gz
      - type: file
        url: https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz
        sha256: 6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1
        dest: build/deps
        dest-filename: opus-1.6.1.tar.gz
      - type: file
        url: https://github.com/webmproject/libvpx/archive/refs/tags/v1.15.2.tar.gz
        sha256: 26fcd3db88045dee380e581862a6ef106f49b74b6396ee95c2993a260b4636aa
        dest: build/deps
        dest-filename: libvpx-1.15.2.tar.gz
      - type: git
        url: https://github.com/chpock/tclmtls.git
        commit: a31a5c08ca0630101d1235e561045f7f7c57e6ce
        dest: build/deps/git/tclmtls-a31a5c08ca0630101d1235e561045f7f7c57e6ce
      - type: git
        url: https://github.com/Mbed-TLS/mbedtls.git
        commit: 5b64a9fdb979c8971561ec78221b528e3cc4e00a
        dest: build/deps/git/mbedtls-5b64a9fdb979c8971561ec78221b528e3cc4e00a
      - type: git
        url: https://github.com/pounceandmiss/libdatachannel-tcl.git
        commit: 9ae99076fd98df9157637b54d98fbe9bfb4b7ce0
        dest: build/deps/git/libdatachannel-tcl-9ae99076fd98df9157637b54d98fbe9bfb4b7ce0
      - type: git
        url: https://github.com/paullouisageneau/libdatachannel.git
        commit: c47f5d77c124c35c31ac8378ad613295a124d354
        dest: build/deps/git/libdatachannel-c47f5d77c124c35c31ac8378ad613295a124d354
      - type: git
        url: https://github.com/pounceandmiss/rtc-ma.git
        commit: bf6e012ba36f6dc9a4611f1c0c54ad875489a265
        dest: build/deps/git/rtc-ma-bf6e012ba36f6dc9a4611f1c0c54ad875489a265
      - type: git
        url: https://codeberg.org/another-im/rtc-mv.git
        commit: 5dfa7c70f2f5c5234b1e58f3bd34f9831f711d86
        dest: build/deps/git/rtc-mv-5dfa7c70f2f5c5234b1e58f3bd34f9831f711d86
      - type: git
        url: https://github.com/pounceandmiss/picomemo-tcl.git
        commit: 254ce9899878a159a8a5bcce575b6ab7437177b5
        dest: build/deps/git/picomemo-tcl-254ce9899878a159a8a5bcce575b6ab7437177b5
      - type: git
        url: https://github.com/pounceandmiss/tclwuffs.git
        commit: d83096c91137102062a95adb431865b9b4ce9017
        dest: build/deps/git/tclwuffs-d83096c91137102062a95adb431865b9b4ce9017
      - type: git
        url: https://github.com/petasis/tkdnd.git
        commit: 6efca37a22b93b2336dc973f2b4a9ba1e3feceaf
        dest: build/deps/git/tkdnd-6efca37a22b93b2336dc973f2b4a9ba1e3feceaf
      - type: git
        url: https://github.com/sqlcipher/sqlcipher.git
        commit: 63697beb0fafcb61faa7a3e6fd267036548ab11b
        dest: build/deps/git/sqlcipher-63697beb0fafcb61faa7a3e6fd267036548ab11b
      - type: git
        url: https://github.com/libtom/libtomcrypt.git
        commit: 7e7eb695d581782f04b24dc444cbfde86af59853
        dest: build/deps/git/libtomcrypt-7e7eb695d581782f04b24dc444cbfde86af59853

  - name: quack
    buildsystem: cmake-ninja
    build-options:
      env:
        # QHash seeds itself randomly per process, and moc, rcc and
        # qmltyperegistrar all walk hashed containers on their way to generating
        # code. SOURCE_DATE_EPOCH is already in the environment here -
        # flatpak/build.sh passes --override-source-date-epoch - and rcc reads
        # it from there.
        QT_HASH_SEED: '0'
        TZ: UTC
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTACKY_ROOT=/app/lib/tacky
      # Nothing here runs the tests, and QUACK_BUILD_TESTS defaults on for a
      # native build, so without this `ninja` links thirty-odd test binaries
      # that are then thrown away with the build dir.
      - -DQUACK_BUILD_TESTS=OFF
      # Which linker ran shows up in the binary, so it must not depend on
      # whether the sdk happens to carry mold. See CMakeLists.txt.
      - -DQUACK_FAST_LINKER=OFF
    sources:
      # The working tree, until there is a repository to name instead.
      - type: dir
        path: ..
        skip:
          - .cache
          - .claude
          - .git
          - build
          - build-android
          - build-appimage
          - build-win
          # This release's own artifacts and the last one's, which have no
          # business being copied into the build of the next.
          - dist
          - flatpak
          # The submodule, whose own build tree runs to gigabytes. tacky is
          # built by the module above from its pinned sources instead.
          - third_party
